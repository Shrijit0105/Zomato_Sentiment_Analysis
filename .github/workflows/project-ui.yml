name: Project Monitor UI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate-project-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Generate Project Monitor SVG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets

          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"

          COMMIT_COUNT=$(git rev-list --count HEAD)

          LAST_COMMIT_DATE=$(git log -1 --format="%cd" --date=format:"%d %b %Y")
          LAST_COMMIT_TIME=$(git log -1 --format="%cd" --date=format:"%H:%M UTC")

          LAST_AUTHOR=$(git log -1 --format="%an")

          if [ "$BRANCH" = "main" ]; then
            BRANCH_DISPLAY="main"
          else
            BRANCH_DISPLAY="$BRANCH"
          fi

          cat > assets/project-status.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg"
               width="1000"
               height="520"
               viewBox="0 0 1000 520">

            <defs>

              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#070b14"/>
                <stop offset="55%" stop-color="#0d1424"/>
                <stop offset="100%" stop-color="#050811"/>
              </linearGradient>

              <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#00f5d4"/>
                <stop offset="50%" stop-color="#00bbf9"/>
                <stop offset="100%" stop-color="#9b5de5"/>
              </linearGradient>

              <filter id="glow">
                <feGaussianBlur stdDeviation="5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

              <filter id="softGlow">
                <feGaussianBlur stdDeviation="2"/>
              </filter>

              <pattern id="grid"
                       width="32"
                       height="32"
                       patternUnits="userSpaceOnUse">
                <path d="M 32 0 L 0 0 0 32"
                      fill="none"
                      stroke="#ffffff"
                      stroke-opacity="0.035"
                      stroke-width="1"/>
              </pattern>

              <style>
                .title {
                  font-family: monospace;
                  font-size: 27px;
                  font-weight: bold;
                  fill: #ffffff;
                }

                .subtitle {
                  font-family: monospace;
                  font-size: 13px;
                  fill: #7f8da8;
                }

                .label {
                  font-family: monospace;
                  font-size: 11px;
                  fill: #687891;
                  letter-spacing: 1px;
                }

                .value {
                  font-family: monospace;
                  font-size: 15px;
                  font-weight: bold;
                  fill: #e8f0ff;
                }

                .pipeline {
                  font-family: monospace;
                  font-size: 12px;
                  font-weight: bold;
                  fill: #dce8ff;
                }

                .small {
                  font-family: monospace;
                  font-size: 10px;
                  fill: #65748d;
                }
              </style>

            </defs>

            <!-- BACKGROUND -->
            <rect width="1000"
                  height="520"
                  rx="22"
                  fill="url(#bg)"/>

            <rect width="1000"
                  height="520"
                  rx="22"
                  fill="url(#grid)"/>

            <!-- BORDER -->
            <rect x="1"
                  y="1"
                  width="998"
                  height="518"
                  rx="22"
                  fill="none"
                  stroke="#24324a"
                  stroke-width="2"/>

            <!-- TOP ACCENT -->
            <rect x="0"
                  y="0"
                  width="1000"
                  height="4"
                  rx="2"
                  fill="url(#line)"
                  filter="url(#glow)"/>

            <!-- HEADER -->
            <text x="45"
                  y="55"
                  class="title">
              PROJECT MONITOR // ZOMATO SENTIMENT ANALYSIS
            </text>

            <text x="45"
                  y="79"
                  class="subtitle">
              AI / ML • NLP • DATA ANALYSIS • AUTOMATED REPOSITORY MONITOR
            </text>

            <!-- STATUS -->
            <circle cx="910"
                    cy="55"
                    r="7"
                    fill="#00f5d4"
                    filter="url(#glow)">
              <animate attributeName="opacity"
                       values="1;0.35;1"
                       dur="1.8s"
                       repeatCount="indefinite"/>
            </circle>

            <text x="930"
                  y="60"
                  class="value"
                  text-anchor="end">
              ACTIVE
            </text>

            <!-- DIVIDER -->
            <line x1="45"
                  y1="105"
                  x2="955"
                  y2="105"
                  stroke="#26344c"/>

            <!-- PROJECT TYPE -->
            <text x="45"
                  y="135"
                  class="label">
              PROJECT TYPE
            </text>

            <text x="45"
                  y="158"
                  class="value">
              AI / ML • SENTIMENT ANALYSIS
            </text>

            <text x="500"
                  y="135"
                  class="label">
              MODEL
            </text>

            <text x="500"
                  y="158"
                  class="value">
              LINEAR REGRESSION
            </text>

            <!-- PIPELINE -->
            <text x="45"
                  y="200"
                  class="label">
              ANALYTICAL PIPELINE
            </text>

            <!-- PIPELINE LINE -->
            <line x1="55"
                  y1="238"
                  x2="945"
                  y2="238"
                  stroke="url(#line)"
                  stroke-width="2"
                  opacity="0.7"/>

            <!-- PIPELINE NODES -->

            <circle cx="90"
                    cy="238"
                    r="9"
                    fill="#00f5d4"
                    filter="url(#glow)"/>

            <circle cx="270"
                    cy="238"
                    r="9"
                    fill="#00f5d4"
                    filter="url(#glow)"/>

            <circle cx="450"
                    cy="238"
                    r="9"
                    fill="#00f5d4"
                    filter="url(#glow)"/>

            <circle cx="630"
                    cy="238"
                    r="9"
                    fill="#00bbf9"
                    filter="url(#glow)"/>

            <circle cx="810"
                    cy="238"
                    r="9"
                    fill="#9b5de5"
                    filter="url(#glow)"/>

            <!-- PIPELINE LABELS -->

            <text x="90"
                  y="270"
                  text-anchor="middle"
                  class="pipeline">
              DATA
            </text>

            <text x="270"
                  y="270"
                  text-anchor="middle"
                  class="pipeline">
              CLEANING
            </text>

            <text x="450"
                  y="270"
                  text-anchor="middle"
                  class="pipeline">
              EDA
            </text>

            <text x="630"
                  y="270"
                  text-anchor="middle"
                  class="pipeline">
              MODEL
            </text>

            <text x="810"
                  y="270"
                  text-anchor="middle"
                  class="pipeline">
              RESULTS
            </text>

            <!-- MOVING SCANNER -->
            <rect x="60"
                  y="230"
                  width="40"
                  height="16"
                  rx="8"
                  fill="#ffffff"
                  opacity="0.25"
                  filter="url(#softGlow)">

              <animate attributeName="x"
                       values="60;900;60"
                       dur="5s"
                       repeatCount="indefinite"/>

            </rect>

            <!-- STATS PANEL -->

            <rect x="45"
                  y="310"
                  width="910"
                  height="135"
                  rx="14"
                  fill="#0a1020"
                  stroke="#202e45"/>

            <!-- COLUMN 1 -->

            <text x="70"
                  y="340"
                  class="label">
              COMMITS
            </text>

            <text x="70"
                  y="367"
                  class="value">
              ${COMMIT_COUNT}
            </text>

            <text x="70"
                  y="405"
                  class="label">
              BRANCH
            </text>

            <text x="70"
                  y="427"
                  class="value">
              ${BRANCH_DISPLAY}
            </text>

            <!-- COLUMN 2 -->

            <text x="320"
                  y="340"
                  class="label">
              LAST UPDATE
            </text>

            <text x="320"
                  y="367"
                  class="value">
              ${LAST_COMMIT_DATE}
            </text>

            <text x="320"
                  y="405"
                  class="label">
              TIME
            </text>

            <text x="320"
                  y="427"
                  class="value">
              ${LAST_COMMIT_TIME}
            </text>

            <!-- COLUMN 3 -->

            <text x="610"
                  y="340"
                  class="label">
              LAST CONTRIBUTOR
            </text>

            <text x="610"
                  y="367"
                  class="value">
              ${LAST_AUTHOR}
            </text>

            <text x="610"
                  y="405"
                  class="label">
              SYSTEM
            </text>

            <text x="610"
                  y="427"
                  class="value">
              OPERATIONAL
            </text>

            <!-- FOOTER -->

            <line x1="45"
                  y1="470"
                  x2="955"
                  y2="470"
                  stroke="#26344a"/>

            <text x="45"
                  y="493"
                  class="small">
              AUTO-GENERATED • GITHUB ACTIONS • REPOSITORY MONITOR
            </text>

            <text x="955"
                  y="493"
                  text-anchor="end"
                  class="small">
              $REPO
            </text>

          </svg>
          EOF

      - name: Commit updated Project Monitor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/project-status.svg

          if git diff --cached --quiet; then
            echo "No Project Monitor changes detected."
            exit 0
          fi

          git commit -m "chore: update project monitor"

          git pull --rebase origin "${{ github.ref_name }}"

          git push origin HEAD:"${{ github.ref_name }}"
